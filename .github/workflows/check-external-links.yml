name: External link check

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check external links
        run: >-
          python scripts/check_external_links.py
          --timeout 8
          --retries 1
          --workers 4
          --max-seconds 900
          --output reports/maintenance/external-links.json
          --report reports/maintenance/external-links.md
      - uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: reports/maintenance/external-links.*
          if-no-files-found: error
          retention-days: 30
