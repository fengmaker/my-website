   <g id="text_1">
    <text style="font: 700 21px 'Microsoft YaHei'; text-anchor: start" x="38.16" y="44.326875" transform="rotate(-0 38.16 44.326875)">没有一步严格改善，仍可沿平台走向更好解</text>
   </g>
   <g id="text_2">
    <text style="fill: #6b7280; font: 12px 'Microsoft YaHei'; text-anchor: start" x="38.16" y="79.3173" transform="rotate(-0 38.16 79.3173)">三组队列都通过判环；箭头各表示一次相邻交换，不表示下降算法会接受每一步。</text>
   </g>
