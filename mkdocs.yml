site_name: cjs 的学习笔记
site_url: https://fengmaker.github.io/my-website/
site_author: cjs
site_description: 运筹优化、算法练习与个人成长记录
repo_url: https://github.com/fengmaker/my-website
edit_uri: edit/main/docs/

# 核心：启用 Material 主题
theme:
  name: material
  language: zh # 设置语言为中文
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: 跟随系统配色
  features:
    - search.suggest # 搜索联想
    - search.highlight # 搜索高亮
    - search.share
    - navigation.top
    - navigation.tabs        # 开启顶部选项卡
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.prune
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - navigation.tracking    # 滚动时自动高亮左侧菜单
    - content.code.copy      # 开启代码块复制功能
    - content.code.select
    - content.code.annotate
    - content.action.edit
    - content.action.view
# 扩展功能（Markdown 语法增强）
markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight: # 代码高亮
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: true     #  显示行号，方便以后对代码进行引用
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition # 提示块（那种带颜色的 Note/Warning 框）
  - toc:
      permalink: true # 标题旁边的锚点链接

plugins:
  - search:
      jieba_dict_user: config/search/jieba-user.dict
  - roamlinks
  - tags


