site_name: cjs 的学习笔记
site_url: https://fengmaker.github.io/my-website/
site_author: cjs
site_description: 运筹优化、算法练习与个人成长记录
repo_url: https://github.com/fengmaker/my-website

# 核心：启用 Material 主题
theme:
  name: material
  language: zh # 设置语言为中文
  palette: 
    primary: indigo # 顶栏颜色（模仿学姐的极简白）
    accent: deep purple
  features:
    - search.suggest # 搜索联想
    - search.highlight # 搜索高亮
    - search.share
    - navigation.top
    - navigation.tabs        # 开启顶部选项卡
    - navigation.tracking    # 滚动时自动高亮左侧菜单
    - content.code.copy      # 开启代码块复制功能
# 扩展功能（Markdown 语法增强）
markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight: # 代码高亮
      anchor_linenums: true
      linenums: true     #  显示行号，方便以后对代码进行引用
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition # 提示块（那种带颜色的 Note/Warning 框）
  - toc:
      permalink: true # 标题旁边的锚点链接

plugins:
  - search
  - roamlinks
  - tags


# 页面导航结构 (如果不写这一块，它会自动根据 docs 文件夹里的文件生成)
